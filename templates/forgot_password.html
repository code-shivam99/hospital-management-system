{% load static %}

<!doctype html>

<html>

<head>

    <title>

        Forgot Password

    </title>

    <link rel="stylesheet"
    href="{% static 'css/style.css' %}">

</head>

<body>

<section class="auth-section">

    <div class="auth-form">

        <h2>

            Forgot Password

        </h2>


        <!-- OTP MESSAGE -->

            {% if otp %}

        <div class="otp-message">

            Your OTP is: {{ otp }}

        </div>

            {% endif %}



        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}

            <input
            type="email"
            name="email"
            placeholder="Enter Registered Email"
            required>


            <button type="submit">

                Reset Password

            </button>

        </form>


        <!-- BUTTON -->

        <div class="auth-buttons">

            <a href="/login/"
            class="back-btn">

                ← Back To Login

            </a>

        </div>

    </div>

</section>

</body>

</html>
